[project]
name = "bouncer"
version = "0.1.0"
description = "A policy enforcement point for agent spending: blocks transactions that violate a declarative policy and writes a tamper-evident, signed audit log of every decision."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "bouncer contributors" }]
keywords = ["agents", "payments", "policy", "audit", "authorization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Runtime dependencies are deliberately few. See ROADMAP.md before adding one.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "cryptography>=42.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # starlette's TestClient requires httpx2; httpx is only the legacy fallback.
    "httpx2>=0.28",
    "mypy>=1.9",
    "types-pyyaml>=6.0",
]

[project.scripts]
bouncer = "bouncer.cli:main"

[project.urls]
Source = "https://github.com/bouncer-dev/bouncer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bouncer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["bouncer", "tests", "examples"]

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true
