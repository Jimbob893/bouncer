name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms are tested on purpose: bouncer's key-permission
        # handling and its timezone database differ on Windows, and both
        # differences have caused real bugs.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # The floor is what keeps the README's coverage badge honest: it cannot
      # quietly rot as code is added without tests.
      - name: Tests
        run: python -m pytest --cov=bouncer --cov-report=term --cov-fail-under=85

      - name: Types
        run: python -m mypy

      - name: Demo runs end to end
        run: python examples/demo.py
